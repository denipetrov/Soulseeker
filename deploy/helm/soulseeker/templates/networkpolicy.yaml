{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "soulseeker.labels" . | nindent 4 }}
spec:
  # Only the gateway may connect: the public API is reached through it, with
  # its TLS and its X-Forwarded-For, never around it. Outbound traffic is not
  # restricted — Blizzard, Raider.io, Rankwarden, MongoDB, Redis and DNS.
  podSelector:
    matchLabels:
      {{- include "soulseeker.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.networkPolicy.allowedNamespaces }}
    - ports:
        - protocol: TCP
          port: 3001
      from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
    {{- else }}
    []
    {{- end }}
{{- end }}
