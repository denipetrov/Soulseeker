{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "soulseeker.labels" . | nindent 4 }}
spec:
  # A node drain takes replicas one at a time, never the whole API.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "soulseeker.selectorLabels" . | nindent 6 }}
{{- end }}
