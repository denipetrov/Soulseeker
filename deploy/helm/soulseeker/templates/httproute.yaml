{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "soulseeker.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml (required "httpRoute.parentRefs is required" .Values.httpRoute.parentRefs) | nindent 4 }}
  hostnames:
    {{- toYaml (required "httpRoute.hostnames is required" .Values.httpRoute.hostnames) | nindent 4 }}
  rules:
    # Readiness detail (dependency hosts, budgets) is for the cluster, not the
    # internet: the public route stops at liveness.
    - matches:
        - path:
            type: Exact
            value: /health/ready
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: 3001
{{- end }}
